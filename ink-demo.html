<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>DDiary Ink Engine — dev harness</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           margin: 0; padding: 16px; background: #f8fafc; color: #0f172a; }
    h1 { font-size: 15px; margin: 0 0 10px; color: #475569; font-weight: 700;
         text-transform: uppercase; letter-spacing: .05em; }
    #bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
    button, select { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px;
                     border: 1px solid #cbd5e1; background: #fff; cursor: pointer; }
    button.on { background: #7c3aed; color: #fff; border-color: #7c3aed; }
    .dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff;
           box-shadow: 0 0 0 1px #cbd5e1; padding: 0; }
    #wrap { border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden;
            display: inline-block; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    canvas { display: block; touch-action: none; cursor: crosshair; }
    #stat { margin-top: 8px; font-size: 12px; color: #475569; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <h1>Ink engine — dev harness</h1>
  <div id="bar">
    <button class="dot" style="background:#1a1a2e" data-color="#1a1a2e"></button>
    <button class="dot" style="background:#dc2626" data-color="#dc2626"></button>
    <button class="dot" style="background:#2563eb" data-color="#2563eb"></button>
    <button class="dot" style="background:#15803d" data-color="#15803d"></button>
    <select id="size"><option value=1>Fine</option><option value=2 selected>Medium</option><option value=4>Thick</option><option value=8>Bold</option></select>
    <select id="stab">
      <option value="off">Stabiliser: off</option>
      <option value="light">light</option>
      <option value="medium" selected>medium</option>
      <option value="strong">strong</option>
    </select>
    <select id="bg">
      <option value="ruled" selected>Ruled</option>
      <option value="rule_marg">Ruled + margin</option>
      <option value="grid">Grid</option>
      <option value="dotted">Dotted</option>
      <option value="blank">Blank</option>
    </select>
    <button id="hl">Highlighter</button>
    <button id="er">Eraser</button>
    <button id="undo">Undo</button>
    <button id="redo">Redo</button>
    <button id="clear">Clear</button>
  </div>
  <div id="wrap"><canvas id="c"></canvas></div>
  <div id="stat"></div>

  <script type="module">
    import { createInkEngine, TOOL, STABILIZER_PRESETS } from '/src/ink/inkEngine.js';

    const W = 900, H = 520;
    const canvas = document.getElementById('c');
    const stat = document.getElementById('stat');

    const engine = createInkEngine({
      canvas, width: W, height: H, background: 'ruled',
      onChange: (strokes) => {
        const pts = strokes.reduce((a, s) => a + s.points.length, 0);
        stat.textContent =
          `${strokes.length} strokes · ${pts} points · ~${(engine.estimateSize()/1024).toFixed(1)} KB serialised`;
      },
    });
    window.__engine = engine;   // for automated verification

    let color = '#1a1a2e', size = 2, hl = false, er = false;
    const sync = () => {
      if (er) { engine.setEraser({ active: true }); }
      else { engine.setTool({ type: hl ? TOOL.HIGHLIGHTER : TOOL.PEN, color, size }); }
      document.getElementById('hl').className = hl ? 'on' : '';
      document.getElementById('er').className = er ? 'on' : '';
    };

    document.querySelectorAll('[data-color]').forEach(b =>
      b.onclick = () => { color = b.dataset.color; er = false; sync(); });
    document.getElementById('size').onchange = e => { size = +e.target.value; sync(); };
    document.getElementById('stab').onchange = e => engine.setStabilizer(e.target.value);
    document.getElementById('bg').onchange   = e => engine.setBackground(e.target.value);
    document.getElementById('hl').onclick    = () => { hl = !hl; er = false; sync(); };
    document.getElementById('er').onclick    = () => { er = !er; sync(); };
    document.getElementById('undo').onclick  = () => engine.undo();
    document.getElementById('redo').onclick  = () => engine.redo();
    document.getElementById('clear').onclick = () => engine.clear();
    sync();
  </script>
</body>
</html>
