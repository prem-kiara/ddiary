<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Dhanam — native ink test</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           margin: 0; padding: 20px; background: #f8fafc; color: #0f172a; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p  { font-size: 14px; color: #475569; margin: 0 0 16px; line-height: 1.5; }
    button { font: inherit; font-size: 16px; font-weight: 600; padding: 14px 22px;
             border-radius: 12px; border: none; background: #7c3aed; color: #fff; }
    button.secondary { background: #fff; color: #334155; border: 1px solid #cbd5e1; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
    #out { border: 1px solid #e2e8f0; border-radius: 12px; background: #fff; padding: 10px;
           min-height: 200px; }
    #out img { max-width: 100%; display: block; }
    #meta { font-family: ui-monospace, monospace; font-size: 12px; color: #475569; margin-top: 10px;
            white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Native handwriting test</h1>
  <p>
    Tap below to open <strong>PencilKit</strong> — the same component Apple Notes uses.
    Write a few words quickly, including lifting the pen between words, then tap Done.
    Compare how it feels against the web canvas in the browser.
  </p>

  <div class="row">
    <button id="open">✍️ Open native handwriting</button>
    <button id="reopen" class="secondary">Reopen last drawing</button>
  </div>

  <div id="out">Nothing yet.</div>
  <div id="meta"></div>

  <script>
    let lastDrawing = null;

    const meta = (s) => { document.getElementById('meta').textContent = s; };

    async function plugin() {
      const cap = window.Capacitor;
      if (!cap || !cap.Plugins || !cap.Plugins.NativeInk) {
        meta('NativeInk plugin not available — is this running inside the app shell?');
        return null;
      }
      return cap.Plugins.NativeInk;
    }

    async function open(withExisting) {
      const NativeInk = await plugin();
      if (!NativeInk) return;
      const t0 = Date.now();
      const res = await NativeInk.open(withExisting && lastDrawing ? { drawing: lastDrawing } : {});
      const dt = Date.now() - t0;

      if (res.cancelled) { meta(`cancelled after ${dt} ms`); return; }
      lastDrawing = res.drawing || null;

      const out = document.getElementById('out');
      out.innerHTML = '';
      if (res.png) {
        const img = new Image();
        img.src = 'data:image/png;base64,' + res.png;
        out.appendChild(img);
      } else {
        out.textContent = '(empty drawing)';
      }
      meta(
        `session ${dt} ms\n` +
        `vector (PKDrawing) ${res.drawing ? Math.round(res.drawing.length * 3 / 4 / 1024) : 0} KB\n` +
        `preview png ${res.png ? Math.round(res.png.length * 3 / 4 / 1024) : 0} KB\n` +
        `reopen works: the vector is handed back in and stays editable`
      );
    }

    document.getElementById('open').onclick = () => open(false);
    document.getElementById('reopen').onclick = () => open(true);
  </script>
</body>
</html>
