name: Sheet Row Reminders

on:
  schedule:
    # Runs every hour at :00 UTC.
    # IST = UTC+5:30, so "09:00 IST" = "03:30 UTC" — the 03:00 UTC run fires within the ±30-min window.
    - cron: '0 * * * *'
  workflow_dispatch:
    # Also triggerable manually from the GitHub Actions tab (useful for testing).

jobs:
  send-reminders:
    name: Send due row reminders
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Install dependencies
        run: npm install --production
        working-directory: scripts

      - name: Send reminders
        run: node sendSheetRowReminders.js
        working-directory: scripts
        env:
          # Firebase service account — base64-encoded JSON from GitHub secret
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
          # SendGrid
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM: noreply@dhanam.finance
