# /etc/nginx/sites-available/diary.dhanamfinance.com.conf
#
# Dhanam DDiary SPA — nginx serves React dist/, /api/* proxied to Express on 127.0.0.1:3002
# After enabling: sudo certbot --nginx -d diary.dhanamfinance.com
#
# IMPORTANT: Do NOT add separate location blocks for /_stcore/ or similar.
# The catch-all location / handles SPA routing via try_files.
# The /api/ block MUST appear before location / so it takes precedence.

server {
    server_name diary.dhanamfinance.com;

    root  /var/www/ddiary;
    index index.html;

    access_log /var/log/nginx/diary.dhanamfinance.com.access.log;
    error_log  /var/log/nginx/diary.dhanamfinance.com.error.log;

    # Security headers (same as other Dhanam apps)
    add_header X-Content-Type-Options  "nosniff"                          always;
    add_header X-Frame-Options         "SAMEORIGIN"                       always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;

    client_max_body_size 25M;

    # ── API proxy ── must come before the catch-all location / ───────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Vite hashed assets — cache aggressively ───────────────────────────────
    # Vite puts all JS/CSS bundles in /assets/ with content hash in the filename.
    # These are safe to cache for 1 year (hash changes on every deploy).
    location /assets/ {
        expires           1y;
        add_header        Cache-Control "public, immutable";
        access_log        off;
    }

    # ── SPA fallback — all other routes → index.html ─────────────────────────
    # React Router handles client-side routing; index.html must be served for
    # every path that isn't a real file (e.g. /tasks, /diary, /sheets).
    location / {
        try_files         $uri $uri/ /index.html;
        add_header        Cache-Control "no-cache, must-revalidate";
        expires           off;
    }

    # Certbot will add SSL certificate lines below this comment
    listen 80;
    listen [::]:80;
}
